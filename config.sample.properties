# 将本文件复制为 local.properties（位于项目根目录），并填入你自己的密钥。
# 注意：不要把包含真实密钥的 local.properties 提交到版本库。

# 阿里云 DashScope
DASHSCOPE_API_KEY=sk-YOUR-DASHSCOPE-KEY

# 百度地图 & 语音（与百度控制台申请的值保持一致）
BAIDU_MAP_API_KEY=YOUR-BAIDU-MAP-KEY
BAIDU_SPEECH_APP_ID=YOUR-BAIDU-SPEECH-APP-ID
BAIDU_SPEECH_API_KEY=YOUR-BAIDU-SPEECH-API-KEY
BAIDU_SPEECH_SECRET_KEY=YOUR-BAIDU-SPEECH-SECRET-KEY

# 百度 TTS（AIPE SDK）
BAIDU_TTS_API_KEY=YOUR-BAIDU-TTS-API-KEY
BAIDU_TTS_SECRET_KEY=YOUR-BAIDU-TTS-SECRET-KEY

# 火山引擎 Ark
ARK_API_KEY=YOUR-ARK-API-KEY

